[project]
name = "qubesight-livekit-agent"
version = "0.1.0"
description = "Shared LiveKit worker for QubeSight voice agents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents~=1.8",
  "python-dotenv~=1.1",
]

[dependency-groups]
dev = [
  "pytest~=8.4",
  "ruff~=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qubesight_livekit_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
