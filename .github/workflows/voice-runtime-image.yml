name: Voice runtime image

on:
  pull_request:
    paths:
      - services/voice-agent-runtime/**
      - .github/workflows/voice-runtime-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3
      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: services/voice-agent-runtime
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/qubesight-ai/voice-agent:${{ github.sha }}
            ghcr.io/qubesight-ai/voice-agent:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
